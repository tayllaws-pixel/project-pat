[project]
name = "project-pat"
version = "0.1.0"
description = "Project PAT — Proxmox-hosted personal AI ecosystem (Pat, Wade, Sentinel)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
services = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "psycopg[binary]>=3.2", "httpx>=0.27"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "services/shared", "services/sentinel", "infra"]
